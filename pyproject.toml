[project]
name = "automatedfe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "geneticengine",
    "matplotlib>=3.10",
    "mlflow>=3.5",
    "numba>=0.66.0",
    "numpy==2.2.6",
    "pandas>=2.2",
    "polars>=1.43.2",
    "pyarrow>=25.0.0",
    "scikit-learn==1.7.2",
]

[project.scripts]
automatedfe = "automatedfe.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
# Include the domain subpackages recursively as they are added under this
# package root.
packages = ["src/automatedfe"]

[tool.uv.sources]
geneticengine = { path = "../GeneticEngine", editable = true }
